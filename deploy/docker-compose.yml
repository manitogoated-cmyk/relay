# docker compose -f deploy/docker-compose.yml up -d --build
# Needs RELAY_DOMAIN (e.g. relay.example.com) pointing at this host, ports 80/443 open.
services:
  relay:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      RELAY_ENVIRONMENT: production
      RELAY_PUBLIC_BASE_URL: https://${RELAY_DOMAIN:?set RELAY_DOMAIN}
    volumes: [relay-data:/data]
    expose: ["8100"]
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { RELAY_DOMAIN: "${RELAY_DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [relay]
volumes:
  relay-data:
  caddy-data:
